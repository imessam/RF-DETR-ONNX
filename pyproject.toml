[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/modules"]

[project]
name = "rf-detr-onnx"
version = "0.1.0"
description = "Scripts to use ONNX version of RF-DETR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "requests",
    "onnxruntime-gpu>=1.17.0",
]

[project.optional-dependencies]
export = ["rfdetr", "rfdetr[onnxexport]"]

test = ["pytest>=9.0.2", "rfdetr"]

docs = [
    "mkdocs==1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
